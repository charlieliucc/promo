<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fff8eb" />
    <meta name="description" content="周四早！橙子风味鸡扒堡和暴打鲜橙，两件套 0 元。" />
    <title>周四早！橙子风味鸡扒堡</title>
    <style>
      :root {
        color-scheme: light;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        --ink: #352013;
        --muted: #775c49;
        --orange: #ff681d;
        --deep-orange: #d9450b;
        --cream: #fff8eb;
      }

      * { box-sizing: border-box; }
      html { min-height: 100%; }
      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        overflow-x: hidden;
        background: var(--cream);
        color: var(--ink);
      }
      button { font: inherit; }
      button:focus-visible, a:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }

      .page {
        position: relative;
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        isolation: isolate;
      }
      .page::before {
        position: absolute;
        z-index: -1;
        top: -240px;
        left: -250px;
        width: 620px;
        height: 620px;
        border: 1px solid rgba(255, 133, 50, .13);
        border-radius: 50%;
        box-shadow: 0 0 0 72px rgba(255, 133, 50, .045), 0 0 0 144px rgba(255, 133, 50, .035);
        content: "";
        pointer-events: none;
      }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        width: min(100% - 96px, 1320px);
        margin: 0 auto;
        padding: 28px 0 16px;
      }
      .brand { display: flex; align-items: center; gap: 11px; font-size: 19px; font-weight: 900; letter-spacing: -.04em; }
      .brand-mark { display: grid; width: 34px; height: 34px; place-items: center; border-radius: 50%; background: var(--orange); color: white; font-size: 20px; }
      .top-note { color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .18em; }

      .hero {
        display: grid;
        grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr);
        align-items: center;
        gap: 26px;
        width: min(100% - 96px, 1320px);
        min-height: min(760px, calc(100vh - 116px));
        margin: auto;
        padding: 28px 0 64px;
      }
      .copy { z-index: 1; padding: 30px 0 30px 12px; }
      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 9px 14px;
        border: 1.5px solid #ffb987;
        border-radius: 100px;
        background: #fff2df;
        color: var(--deep-orange);
        font-size: 13px;
        font-weight: 900;
        letter-spacing: .08em;
      }
      .eyebrow::before { width: 7px; height: 7px; border-radius: 50%; background: var(--orange); content: ""; }
      h1 { margin: 26px 0 16px; font-size: clamp(58px, 6.2vw, 104px); font-weight: 950; letter-spacing: -.085em; line-height: 1.06; }
      h1 span { display: block; white-space: nowrap; }
      h1 .accent { color: var(--orange); }
      .intro { margin: 0 0 28px; color: var(--muted); font-size: clamp(16px, 1.45vw, 20px); font-weight: 700; line-height: 1.75; }
      .price-line { display: flex; align-items: flex-end; gap: 16px; margin: 0 0 16px; }
      .price-caption { display: flex; flex-direction: column; gap: 5px; padding-bottom: 11px; font-size: 16px; font-weight: 900; }
      .price-caption small { color: var(--muted); font-size: 12px; letter-spacing: .06em; }
      .price { display: flex; align-items: baseline; color: var(--deep-orange); line-height: .92; white-space: nowrap; }
      .price .currency { align-self: flex-start; margin-top: 11px; font-size: 34px; font-weight: 900; }
      .price strong { font-size: clamp(94px, 10vw, 142px); font-weight: 950; letter-spacing: -.1em; }
      .price .unit { margin-left: 8px; font-size: 28px; font-weight: 900; }
      .details { display: grid; gap: 9px; margin: 14px 0 31px; padding: 0; list-style: none; color: #5c3923; font-size: 17px; font-weight: 700; line-height: 1.55; }
      .details li { display: flex; gap: 10px; }
      .details b { color: var(--orange); }
      .order-button {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 54px;
        min-width: 276px;
        min-height: 68px;
        padding: 0 21px 0 28px;
        border: 0;
        border-radius: 18px;
        background: var(--orange);
        box-shadow: 0 12px 0 #e8ac75, 0 22px 35px rgba(214, 90, 17, .18);
        color: white;
        cursor: pointer;
        font-size: 23px;
        font-weight: 900;
        transition: transform .16s ease, box-shadow .16s ease, background .16s ease;
      }
      .order-button:hover { transform: translateY(-3px); background: #ef5811; box-shadow: 0 15px 0 #e8ac75, 0 25px 36px rgba(214, 90, 17, .22); }
      .order-button:active { transform: translateY(7px); box-shadow: 0 5px 0 #e8ac75, 0 9px 18px rgba(214, 90, 17, .2); }
      .order-button .arrow { display: grid; width: 37px; height: 37px; place-items: center; border-radius: 50%; background: rgba(255,255,255,.2); font-size: 23px; font-weight: 400; }
      .signoff { margin: 29px 0 0; color: var(--muted); font-size: 13px; font-weight: 700; letter-spacing: .05em; }

      .art {
        position: relative;
        display: grid;
        min-height: 680px;
        place-items: center;
      }
      .art-panel {
        position: absolute;
        inset: 32px 4% 27px 3%;
        overflow: hidden;
        border: 2px solid #ff8b33;
        border-radius: 44% 44% 38px 38px / 30% 30% 38px 38px;
        background: radial-gradient(circle at 52% 30%, #ffd663 0 20%, #ffad39 50%, #ff7d28 100%);
        box-shadow: 19px 22px 0 #ffdec0;
      }
      .art-panel::before, .art-panel::after { position: absolute; border: 2px solid rgba(255, 250, 218, .7); border-radius: 50%; content: ""; }
      .art-panel::before { width: 540px; height: 540px; left: 50%; top: 42%; transform: translate(-50%, -50%); }
      .art-panel::after { width: 650px; height: 650px; left: 50%; top: 42%; transform: translate(-50%, -50%); }
      .art-heading { position: absolute; z-index: 2; top: 58px; left: 12%; color: #fff9e8; font-size: clamp(16px, 1.6vw, 23px); font-weight: 950; letter-spacing: .2em; text-shadow: 0 2px 0 rgba(150, 62, 0, .2); }
      .food-illustration { position: relative; z-index: 1; width: 100%; max-width: 760px; height: auto; overflow: visible; filter: drop-shadow(8px 24px 17px rgba(108, 50, 15, .24)); }
      .art-sticker {
        position: absolute;
        z-index: 2;
        right: 0;
        bottom: 85px;
        display: grid;
        width: 135px;
        height: 135px;
        place-items: center;
        border: 2px solid var(--ink);
        border-radius: 50%;
        background: #fff9e7;
        box-shadow: 7px 8px 0 rgba(64, 32, 10, .16);
        color: var(--deep-orange);
        font-size: 24px;
        font-weight: 950;
        line-height: 1.25;
        text-align: center;
        transform: rotate(13deg);
      }
      .art-star { position: absolute; z-index: 2; color: #fff6d0; font-size: 48px; line-height: 1; }
      .art-star.one { top: 145px; right: 6%; transform: rotate(-15deg); }
      .art-star.two { bottom: 105px; left: 2%; font-size: 30px; }

      .bottom-strip { margin-top: auto; padding: 15px 24px; background: var(--ink); color: #fff3da; font-size: 13px; font-weight: 900; letter-spacing: .16em; text-align: center; }
      .bottom-strip span { margin: 0 18px; color: #ffad52; }

      .gift-dialog {
        width: min(480px, calc(100vw - 28px));
        max-height: calc(100dvh - 28px);
        margin: auto;
        padding: 28px;
        overflow: auto;
        border: 0;
        border-radius: 28px;
        background: #fffaf0;
        box-shadow: 0 32px 100px rgba(41, 20, 6, .3);
        color: var(--ink);
      }
      .gift-dialog::backdrop { background: rgba(39, 22, 9, .64); backdrop-filter: blur(5px); }
      .dialog-top { display: flex; align-items: start; justify-content: space-between; gap: 12px; }
      .dialog-kicker { margin: 0 0 7px; color: var(--deep-orange); font-size: 12px; font-weight: 900; letter-spacing: .16em; }
      .dialog-title { margin: 0; font-size: clamp(25px, 7vw, 33px); font-weight: 950; letter-spacing: -.05em; line-height: 1.2; }
      .close-button { display: grid; flex: none; width: 38px; height: 38px; place-items: center; border: 0; border-radius: 50%; background: #f7e9d6; color: var(--ink); cursor: pointer; font-size: 24px; line-height: 1; }
      .dialog-lead { margin: 16px 0 20px; color: var(--muted); font-size: 16px; font-weight: 700; line-height: 1.7; }
      .food-card {
        position: relative;
        min-height: 260px;
        overflow: hidden;
        padding: 25px;
        border-radius: 23px;
        background: linear-gradient(135deg, #ffb34e 0%, #ff7729 52%, #e84b16 100%);
        box-shadow: 0 14px 25px rgba(185, 71, 12, .18);
        color: white;
      }
      .food-card::before, .food-card::after { position: absolute; border: 2px solid rgba(255,255,255,.32); border-radius: 50%; content: ""; pointer-events: none; }
      .food-card::before { top: -120px; right: -110px; width: 310px; height: 310px; }
      .food-card::after { bottom: -170px; right: -95px; width: 320px; height: 320px; }
      .card-label { position: relative; z-index: 1; margin: 0 0 25px; font-size: 13px; font-weight: 900; letter-spacing: .14em; }
      .card-title { position: relative; z-index: 1; margin: 0 0 13px; font-size: 42px; font-weight: 950; letter-spacing: -.08em; }
      .card-rule { position: relative; z-index: 1; max-width: 250px; margin: 0; font-size: 17px; font-weight: 800; line-height: 1.6; }
      .card-orange { position: absolute; right: 9px; bottom: -30px; width: 180px; height: 180px; opacity: .9; transform: rotate(-14deg); }
      .song-line { margin: 20px 0 4px; font-size: 17px; font-weight: 900; text-align: center; }
      .song-credit { margin: 0; color: var(--muted); font-size: 11px; text-align: center; }
      .dialog-end { margin: 16px 0 0; color: var(--muted); font-size: 14px; font-weight: 700; text-align: center; }

      @media (max-width: 1050px) {
        .topbar, .hero { width: min(100% - 48px, 900px); }
        .hero { gap: 0; }
        .copy { padding-left: 0; }
        .art { min-height: 570px; }
        .art-sticker { width: 106px; height: 106px; right: -4px; bottom: 56px; font-size: 19px; }
      }
      @media (max-width: 740px) {
        .topbar { width: calc(100% - 36px); padding: 18px 0 4px; }
        .brand { font-size: 16px; }
        .brand-mark { width: 29px; height: 29px; font-size: 17px; }
        .top-note { font-size: 10px; letter-spacing: .08em; }
        .hero { display: flex; flex-direction: column; align-items: stretch; width: calc(100% - 36px); min-height: 0; padding: 20px 0 44px; }
        .copy { padding: 0; }
        .eyebrow { padding: 7px 11px; font-size: 11px; }
        h1 { margin: 17px 0 8px; font-size: clamp(49px, 12.2vw, 76px); }
        .intro { margin-bottom: 14px; font-size: 14px; line-height: 1.5; }
        .price-line { gap: 12px; margin-bottom: 10px; }
        .price-caption { gap: 2px; padding-bottom: 7px; font-size: 14px; }
        .price-caption small { font-size: 10px; }
        .price .currency { margin-top: 7px; font-size: 27px; }
        .price strong { font-size: 88px; }
        .price .unit { font-size: 23px; }
        .details { gap: 3px; margin: 8px 0 21px; font-size: 14px; }
        .order-button { justify-content: center; width: 100%; min-height: 58px; gap: 20px; border-radius: 15px; font-size: 19px; box-shadow: 0 8px 0 #e8ac75, 0 15px 23px rgba(214, 90, 17, .16); }
        .order-button:hover { box-shadow: 0 11px 0 #e8ac75, 0 18px 25px rgba(214, 90, 17, .18); }
        .order-button:active { transform: translateY(5px); box-shadow: 0 3px 0 #e8ac75; }
        .order-button .arrow { width: 31px; height: 31px; font-size: 20px; }
        .signoff { margin: 20px 0 0; font-size: 11px; }
        .art { min-height: min(470px, 104vw); margin-top: 22px; }
        .art-panel { inset: 12px 2% 15px; border-radius: 45% 45% 24px 24px / 31% 31% 24px 24px; box-shadow: 10px 12px 0 #ffdec0; }
        .art-heading { top: 31px; left: 12%; font-size: 15px; }
        .art-sticker { right: 0; bottom: 28px; width: 85px; height: 85px; font-size: 15px; }
        .art-star.one { top: 80px; font-size: 32px; }
        .art-star.two { bottom: 45px; font-size: 25px; }
        .bottom-strip { padding: 12px; font-size: 10px; letter-spacing: .08em; }
        .bottom-strip span { margin: 0 6px; }
      }
      @media (max-width: 380px) {
        h1 { font-size: 47px; }
        .price strong { font-size: 78px; }
        .intro { font-size: 13px; }
        .details { font-size: 13px; }
        .art { min-height: 335px; }
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true">✳</span><span>周四早！</span></div>
        <span class="top-note">THURSDAY MORNING</span>
      </header>

      <main class="hero">
        <section class="copy" aria-labelledby="product-title">
          <span class="eyebrow">一周元气开场</span>
          <h1 id="product-title"><span>橙子风味</span><span class="accent">鸡扒堡</span></h1>
          <p class="intro">酥脆鸡扒，裹上浓郁橙子酱。<br />再来杯暴打鲜橙，快乐刚刚好。</p>
          <div class="price-line" aria-label="两件套只要 0 元">
            <div class="price-caption"><span>两件套</span><small>只要</small></div>
            <div class="price" aria-hidden="true"><span class="currency">¥</span><strong>0</strong><span class="unit">元</span></div>
          </div>
          <ul class="details">
            <li><b aria-hidden="true">✦</b><span>橙子风味鸡扒堡 × 1</span></li>
            <li><b aria-hidden="true">✦</b><span>暴打鲜橙 × 1</span></li>
          </ul>
          <button class="order-button" id="orderButton" type="button" aria-haspopup="dialog" aria-controls="giftDialog">
            <span>戳下单</span><span class="arrow" aria-hidden="true">↗</span>
          </button>
          <p class="signoff">🍗 + 🍊 = 元气满满的周四早晨</p>
        </section>

        <div class="art" aria-hidden="true">
          <div class="art-panel"></div>
          <span class="art-heading">橙香 · 酥脆 · 元气</span>
          <span class="art-star one">✳</span><span class="art-star two">✦</span>
          <svg class="food-illustration" viewBox="0 0 720 680" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffdc8a"/><stop offset=".63" stop-color="#e89a45"/><stop offset="1" stop-color="#c9742e"/></linearGradient>
              <linearGradient id="chicken" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#bd5c20"/><stop offset=".5" stop-color="#7d3817"/><stop offset="1" stop-color="#4c2413"/></linearGradient>
              <linearGradient id="drink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffd72f"/><stop offset=".55" stop-color="#ff9d12"/><stop offset="1" stop-color="#ee6117"/></linearGradient>
              <filter id="shadow"><feGaussianBlur stdDeviation="14"/></filter>
            </defs>
            <ellipse cx="330" cy="585" rx="260" ry="42" fill="#9b4117" opacity=".22" filter="url(#shadow)"/>
            <!-- Orange slices behind the meal -->
            <g transform="translate(92 280) rotate(-21)">
              <circle r="84" fill="#ffe7a0" stroke="#fa7b1c" stroke-width="17"/>
              <circle r="61" fill="#ffad21"/>
              <path d="M0-60V60M-52-30 52 30M-52 30 52-30" stroke="#fff0b7" stroke-width="6"/>
              <circle r="10" fill="#fff0b7"/>
            </g>
            <!-- Drink -->
            <g transform="translate(488 175) rotate(9)">
              <path d="M10-43 48-133" stroke="#fff2d1" stroke-width="13" stroke-linecap="round"/>
              <path d="M-63 20H87L70 335Q68 351 50 351H-27Q-46 351-48 334Z" fill="#fff3d6" stroke="#a54c20" stroke-width="9"/>
              <path d="M-49 57H73L60 318Q60 329 48 329H-26Q-36 329-38 318Z" fill="url(#drink)"/>
              <path d="M-41 86c33 16 78-12 109 0" fill="none" stroke="#ffdd68" stroke-width="10" opacity=".8"/>
              <path d="M-38 160c42 27 75-9 104 3" fill="none" stroke="#ffdd68" stroke-width="10" opacity=".7"/>
              <ellipse cx="12" cy="19" rx="83" ry="21" fill="#fff3dc" stroke="#a54c20" stroke-width="8"/>
              <path d="M-25 29 1 64l22-37M8 25l20 52 23-54" fill="#fff7e0" opacity=".82"/>
              <circle cx="76" cy="77" r="43" fill="#ffb327" stroke="#fff1bd" stroke-width="8"/>
              <path d="M76 38v78M38 77h77M49 50l54 54M103 50 49 104" stroke="#ffe7a7" stroke-width="4"/>
              <circle cx="76" cy="77" r="8" fill="#fff2c5"/>
            </g>
            <!-- Burger -->
            <g transform="translate(52 260) rotate(-7 260 200)">
              <ellipse cx="272" cy="329" rx="225" ry="42" fill="#5a2a1b" opacity=".22"/>
              <path d="M70 278c82 30 282 33 393-8l-23 55c-84 36-266 41-349 5Z" fill="#ce7a31" stroke="#8c471e" stroke-width="7"/>
              <path d="M64 268c84 24 285 26 400-9l-3 25c-105 29-310 31-395 6Z" fill="#ffe3a1"/>
              <path d="M51 221c36-18 68-12 96-4 45-33 76-15 115-2 45-19 82-20 114-5 40-16 70-8 108 12l-11 40c-112 35-319 33-419 7Z" fill="url(#chicken)" stroke="#623016" stroke-width="10" stroke-linejoin="round"/>
              <path d="M76 237c28-16 44 12 68 1 19-10 27-22 53-11 24 9 42 0 63-10 31-14 40 19 73 10 36-10 47-4 75 7 22 8 37-4 58 2" fill="none" stroke="#e6a044" stroke-width="15" stroke-linecap="round" stroke-dasharray="20 15"/>
              <path d="M57 201c54-12 88 17 132 3 46-15 55-20 97-7 45 15 61-9 103-2 32 6 59 16 88 8" fill="none" stroke="#f96c22" stroke-width="21" stroke-linecap="round"/>
              <path d="M57 183c37 2 57 27 93 21 34-6 46-31 75-27 30 4 37 29 71 25 32-3 39-26 71-24 37 2 57 24 105 12" fill="none" stroke="#8fba3e" stroke-width="22" stroke-linecap="round"/>
              <path d="M54 176c13-11 32-6 48 3 18 11 42 12 60 1 16-10 34-12 52-3 21 10 43 11 65 0 22-11 42-7 60 2 23 12 47 12 67 0 19-12 39-11 62 3" fill="none" stroke="#d5e979" stroke-width="8" stroke-linecap="round"/>
              <path d="M53 161C55 48 139 13 259 11c132-2 212 38 218 150-104 37-312 41-424 0Z" fill="url(#bun)" stroke="#a75a28" stroke-width="9"/>
              <path d="M78 140c21-77 86-109 186-111 89-2 160 32 185 107" fill="none" stroke="#ffe8aa" stroke-width="14" opacity=".55" stroke-linecap="round"/>
              <g fill="#fff0c1" transform="rotate(-8 255 90)">
                <ellipse cx="159" cy="88" rx="8" ry="3"/><ellipse cx="220" cy="55" rx="8" ry="3"/><ellipse cx="279" cy="85" rx="8" ry="3"/><ellipse cx="343" cy="64" rx="8" ry="3"/><ellipse cx="390" cy="106" rx="8" ry="3"/><ellipse cx="118" cy="126" rx="8" ry="3"/><ellipse cx="241" cy="117" rx="8" ry="3"/><ellipse cx="329" cy="126" rx="8" ry="3"/>
              </g>
            </g>
          </svg>
          <div class="art-sticker">两件套<br />0 元</div>
        </div>
      </main>

      <footer class="bottom-strip">周四早！ <span>✳</span> 橙子风味鸡扒堡 <span>✳</span> 暴打鲜橙</footer>
    </div>

    <dialog class="gift-dialog" id="giftDialog" aria-labelledby="dialogTitle" aria-describedby="dialogLead">
      <div class="dialog-top">
        <div><p class="dialog-kicker">下单结果</p><h2 class="dialog-title" id="dialogTitle">迟迟，活动名额已满</h2></div>
        <button class="close-button" id="closeDialog" type="button" aria-label="关闭">×</button>
      </div>
      <p class="dialog-lead" id="dialogLead">不过，送你一张美食卡。</p>
      <div class="food-card" aria-label="美食卡：凭卡无条件加入或发起一场约饭">
        <p class="card-label">FOR 迟迟 · 周四早</p>
        <p class="card-title">美食卡</p>
        <p class="card-rule">凭卡无条件加入<br />或发起一场约饭</p>
        <svg class="card-orange" viewBox="0 0 180 180" aria-hidden="true"><circle cx="90" cy="90" r="75" fill="#ffe8ad" stroke="#fff7dc" stroke-width="9"/><circle cx="90" cy="90" r="58" fill="#ffbc40"/><path d="M90 32v116M40 61l100 58M40 119l100-58" stroke="#ffe5a2" stroke-width="6"/><circle cx="90" cy="90" r="10" fill="#ffe8b7"/></svg>
      </div>
      <p class="song-line">“你迟迟没到场”</p>
      <p class="song-credit">薛之谦《迟迟》</p>
      <p class="dialog-end">但美食卡先到了。想约饭的时候，出示这张卡就好。</p>
    </dialog>

    <script>
      const orderButton = document.getElementById('orderButton');
      const giftDialog = document.getElementById('giftDialog');
      const closeDialog = document.getElementById('closeDialog');

      orderButton.addEventListener('click', () => giftDialog.showModal());
      closeDialog.addEventListener('click', () => giftDialog.close());
      giftDialog.addEventListener('close', () => orderButton.focus());
      giftDialog.addEventListener('click', (event) => {
        if (event.target !== giftDialog) return;
        const bounds = giftDialog.getBoundingClientRect();
        const inside = event.clientX >= bounds.left && event.clientX <= bounds.right && event.clientY >= bounds.top && event.clientY <= bounds.bottom;
        if (!inside) giftDialog.close();
      });
    </script>
  </body>
</html>
